<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随手表情 · 宣传片</title>
<meta name="description" content="在线观看随手表情宣传片《点一下，就够了》和短片《我还是想发这张》。">
<style>
  :root {
    --bg: #faf8f5;
    --fg: #1f1d1a;
    --muted: #6b665f;
    --line: #e4dfd7;
    --chip: #f0ebe3;
    --accent: #c2410c;
    --accent-fg: #fff;
    --stage: #111;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413;
      --fg: #ece8e2;
      --muted: #a39d94;
      --line: #2e2b28;
      --chip: #24211f;
      --accent: #fb923c;
      --accent-fg: #1a1208;
      --stage: #000;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  header img { width: 40px; height: 40px; }
  header a { color: inherit; text-decoration: none; font-weight: 600; }
  nav.films { display: flex; gap: 8px; margin: 24px 0 16px; flex-wrap: wrap; }
  nav.films button, .versions button {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--fg);
    border-radius: 999px;
    padding: 6px 16px;
    cursor: pointer;
  }
  nav.films button[aria-pressed="true"], .versions button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
  }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 16px; }
  .stage {
    background: var(--stage);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }
  video { display: block; width: 100%; max-height: 80vh; background: var(--stage); }
  .stage.portrait video { width: auto; max-width: 100%; height: 80vh; }
  .versions { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 8px; }
  .versions button { font-size: 14px; padding: 4px 14px; }
  .meta { color: var(--muted); font-size: 14px; }
  .meta a { color: var(--accent); }
  .note {
    margin-top: 24px;
    padding: 12px 16px;
    border-left: 3px solid var(--line);
    color: var(--muted);
    font-size: 14px;
  }
</style>
</head>
<body>
<main>
  <header>
    <img src="https://raw.githubusercontent.com/9OwO6/ai-stickers/main/extension/icons/icon128.png" alt="">
    <a href="https://github.com/9OwO6/ai-stickers">随手表情 · AI Stickers</a>
  </header>

  <nav class="films" id="films" aria-label="选择影片"></nav>

  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>

  <div class="stage" id="stage">
    <video id="player" controls playsinline preload="metadata"></video>
  </div>

  <div class="versions" id="versions" aria-label="选择版本"></div>
  <p class="meta">
    视频较大时首次缓冲可能需要几秒。
    <a id="download" href="#">下载当前版本</a> ·
    <a id="release" href="#">发布页</a> ·
    <a href="https://github.com/9OwO6/ai-stickers/blob/main/docs/videos/README.md">制作说明</a>
  </p>

  <p class="note" id="note"></p>
</main>

<script>
  const DL = "https://github.com/9OwO6/ai-stickers/releases/download/";
  const FILMS = {
    "one-click": {
      tab: "点一下，就够了",
      title: "点一下，就够了",
      lede: "想配一张图的那一刻，往往等不到你翻完文件夹。随手表情把收藏放在聊天框旁边，点一下，文字和表情一起发出去。",
      tag: "promo-one-click",
      poster: "videos/one-click-cover.jpg",
      portrait: false,
      note: "60 秒横屏宣传片。画面由代码逐帧渲染，插件和聊天界面是重画的示意画面，不是录屏；AI 回复为剧情示意。表情素材来自 Microsoft Fluent Emoji（MIT）。",
      versions: [
        { id: "en-720p", label: "英语配音中文字幕 · 720p", file: "one-click-en-720p.mp4" },
        { id: "en-1080p", label: "英语配音中文字幕 · 1080p60", file: "one-click-en-1080p.mp4" },
        { id: "zh-1080p", label: "中文配音 · 1080p60", file: "one-click-zh-1080p.mp4" }
      ]
    },
    "warm-chat": {
      tab: "我还是想发这张",
      title: "我还是想发这张",
      lede: "下班想发一张，开心想发一张，连说晚安也想再发一张。聊天窗口换成 AI，那个爱发表情的自己，也想一起带过去。",
      tag: "promo-warm-chat",
      poster: "videos/warm-chat-cover.jpg",
      portrait: true,
      note: "温馨剧情短片，画面由 AI 生成并制作成动态分镜，配音为合成语音。插件操作为隔离浏览器中的实际录制，聊天页面及 AI 接话为剧情示意。",
      versions: [
        { id: "720p", label: "720p", file: "warm-chat-720p.mp4" },
        { id: "1080p", label: "1080p 高清版", file: "warm-chat.mp4" }
      ]
    }
  };

  const $ = (id) => document.getElementById(id);
  const player = $("player");

  function pressed(container, value) {
    for (const b of container.querySelectorAll("button")) {
      b.setAttribute("aria-pressed", String(b.dataset.value === value));
    }
  }

  function show(filmId, versionId, autoplay) {
    const film = FILMS[filmId] || FILMS["one-click"];
    filmId = FILMS[filmId] ? filmId : "one-click";
    const version = film.versions.find((v) => v.id === versionId) || film.versions[0];

    pressed($("films"), filmId);
    $("title").textContent = film.title;
    $("lede").textContent = film.lede;
    $("note").textContent = film.note;
    $("stage").classList.toggle("portrait", film.portrait);
    document.title = film.title + " · 随手表情";

    const versions = $("versions");
    versions.replaceChildren(...film.versions.map((v) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.value = v.id;
      b.textContent = v.label;
      b.onclick = () => show(filmId, v.id, true);
      return b;
    }));
    pressed(versions, version.id);

    const src = DL + film.tag + "/" + version.file;
    if (player.getAttribute("src") !== src) {
      const t = player.currentTime;
      const sameFilm = player.dataset.film === filmId;
      player.poster = film.poster;
      player.src = src;
      player.dataset.film = filmId;
      // 切换同一部片子的清晰度时，从原来的位置接着播
      if (sameFilm && t > 0) {
        player.addEventListener("loadedmetadata", () => { player.currentTime = t; }, { once: true });
      }
      if (autoplay) player.play().catch(() => {});
    }
    $("download").href = src;
    $("release").href = "https://github.com/9OwO6/ai-stickers/releases/tag/" + film.tag;

    const params = new URLSearchParams({ film: filmId, v: version.id });
    history.replaceState(null, "", "?" + params);
  }

  $("films").replaceChildren(...Object.entries(FILMS).map(([id, film]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.value = id;
    b.textContent = film.tab;
    b.onclick = () => show(id, null, false);
    return b;
  }));

  const q = new URLSearchParams(location.search);
  show(q.get("film"), q.get("v"), false);
</script>
</body>
</html>
